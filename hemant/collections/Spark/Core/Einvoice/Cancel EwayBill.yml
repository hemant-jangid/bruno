info:
  name: Cancel EwayBill
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/spark/core/einvoice/cancelewaybill"
  headers:
    - name: gstin
      value: "{{gstin}}"
    - name: irp-api-username
      value: "{{irp-api-username}}"
    - name: irp-api-password
      value: "{{irp-api-password}}"
    - name: Octa-ApiKey
      value: "{{api_key}}"
  body:
    type: json
    data: |-
      {  
      "ewbNo": 181012003837,
      "cancelRsnCode": 2,
      "cancelRmrk": "Cancelled the order"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
