info:
  name: Get HSN Code
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/spark/core/ewb/gethsn?hsncode=25010010"
  headers:
    - name: gstin
      value: "{{gstin}}"
    - name: irp-api-username
      value: "{{irp-api-username}}"
    - name: irp-api-password
      value: "{{irp-api-password}}"
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: hsncode
      value: "25010010"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
