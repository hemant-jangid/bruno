info:
  name: Get EwayBill for Transporter By Date
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/spark/core/ewb/getewaybillsfortransporterbydate?date=20/11/2025"
  headers:
    - name: gstin
      value: "{{gstin}}"
    - name: irp-api-username
      value: "{{irp-api-username}}"
    - name: irp-api-password
      value: "{{irp-api-password}}"
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: date
      value: 20/11/2025
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
