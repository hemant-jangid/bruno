info:
  name: Generate CEWB
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/spark/core/ewb/generatecewb"
  headers:
    - name: gstin
      value: "{{gstin}}"
    - name: irp-api-username
      value: "{{irp-api-username}}"
    - name: irp-api-password
      value: "{{irp-api-password}}"
    - name: Octa-ApiKey
      value: "{{api_key}}"
  body:
    type: json
    data: ' {"fromPlace":"Banglore","fromState":29,"vehicleNo":"RJ112A1110","transMode":"1","tripSheetEwbBills":[{"ewbNo":161012003646},{"ewbNo":161012003828}]}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
