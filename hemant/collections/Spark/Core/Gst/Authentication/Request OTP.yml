info:
  name: Request OTP
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/spark/core/gst/auth/requestotp"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  body:
    type: json
    data: |-
      {
        "userName": "{{username}}",
        "gstin": "{{gstin}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
