info:
  name: Get HSN Data
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns/gstr9?gstin={{gstin}}&action=GETHSN&ret_period=032025&fy=2024-25"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: GETHSN
      type: query
    - name: ret_period
      value: "032025"
      type: query
    - name: fy
      value: 2024-25
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
