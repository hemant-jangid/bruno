info:
  name: Get IMS Doc Count
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns/ims?gstin={{gstin}}&action=GETCNT&goods_typ=ALL_OTH"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: GETCNT
      type: query
    - name: goods_typ
      value: ALL_OTH
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
