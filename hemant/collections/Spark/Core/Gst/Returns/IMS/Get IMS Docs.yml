info:
  name: Get IMS Docs
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns/ims?gstin={{gstin}}&action=GETINV&section=B2B"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: GETINV
      type: query
    - name: section
      value: B2B
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
