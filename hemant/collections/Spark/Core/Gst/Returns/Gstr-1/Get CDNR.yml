info:
  name: Get CDNR
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns/gstr1?gstin={{gstin}}&action=CDNR&ret_period=032025"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: CDNR
      type: query
    - name: ret_period
      value: "032025"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
