info:
  name: Get EXPA
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns/gstr1a?gstin={{gstin}}&action=R1AEXPA&ret_period=032025"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: R1AEXPA
      type: query
    - name: ret_period
      value: "032025"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
