info:
  name: Get Latest RCM Balance
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns/gstr3b?gstin={{gstin}}&action=RCMCLOSINGBAL"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: RCMCLOSINGBAL
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
