info:
  name: Get Return Filing Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns?gstin={{gstin}}&action=RETTRACK&ret_period=012025"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: RETTRACK
      type: query
    - name: ret_period
      value: "012025"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
