info:
  name: Save Preference
  type: http
  seq: 5

http:
  method: PUT
  url: "{{base_url}}/api/spark/core/gst/taxpayer/returns?gstin={{gstin}}&action=SAVEPREF"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: SAVEPREF
      type: query
  body:
    type: json
    data: |-
      {
        "gstin": "33AXTPJ8438P2ZH",
        "fy": "2021-22",
        "quarter": "Q1",
        "preference": "M"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
