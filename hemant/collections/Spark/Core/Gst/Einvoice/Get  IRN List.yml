info:
  name: Get  IRN List
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/einvoice?gstin={{gstin}}&stin={{gstin}}&action=IRNLIST&rtnprd=012026&suptyp=B2B"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: stin
      value: "{{gstin}}"
      type: query
    - name: action
      value: IRNLIST
      type: query
    - name: rtnprd
      value: "012026"
      type: query
    - name: suptyp
      value: B2B
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
