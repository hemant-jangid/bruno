info:
  name: Get EInvoice HSN Summary
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/einvoice?gstin={{gstin}}&action=EINVHSN&ret_period=022026"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: EINVHSN
      type: query
    - name: ret_period
      value: "022026"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
