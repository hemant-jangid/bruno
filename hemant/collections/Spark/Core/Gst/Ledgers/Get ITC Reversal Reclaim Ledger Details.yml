info:
  name: Get ITC Reversal Reclaim Ledger Details
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/ledgers?gstin={{gstin}}&action=REVRCLM&frdt=01-01-2025&todt=31-01-2025"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: REVRCLM
      type: query
    - name: frdt
      value: 01-01-2025
      type: query
    - name: todt
      value: 31-01-2025
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
