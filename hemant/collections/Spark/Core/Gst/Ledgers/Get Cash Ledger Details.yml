info:
  name: Get Cash Ledger Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/ledgers?gstin={{gstin}}&action=CASH&fr_dt=01-12-2025&to_dt=01-02-2026"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: CASH
      type: query
    - name: fr_dt
      value: 01-12-2025
      type: query
    - name: to_dt
      value: 01-02-2026
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
