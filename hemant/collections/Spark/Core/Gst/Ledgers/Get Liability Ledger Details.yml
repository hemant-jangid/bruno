info:
  name: Get Liability Ledger Details
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/ledgers?gstin={{gstin}}&action=TAX&fr_dt=122025&to_dt=022026"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: TAX
      type: query
    - name: fr_dt
      value: "122025"
      type: query
    - name: to_dt
      value: "022026"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
