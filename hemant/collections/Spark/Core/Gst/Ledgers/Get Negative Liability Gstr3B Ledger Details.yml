info:
  name: Get Negative Liability Gstr3B Ledger Details
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/ledgers?gstin={{gstin}}&action=NEGLIABSTMT&from_date=01-01-2025&to_date=31-01-2025"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: NEGLIABSTMT
      type: query
    - name: from_date
      value: 01-01-2025
      type: query
    - name: to_date
      value: 31-01-2025
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
