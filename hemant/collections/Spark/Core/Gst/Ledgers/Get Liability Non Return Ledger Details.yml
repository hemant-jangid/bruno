info:
  name: Get Liability Non Return Ledger Details
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/api/spark/core/gst/taxpayer/ledgers?gstin={{gstin}}&action=NRTN&fromDate=01-01-2026&toDate=31-01-2026"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  params:
    - name: gstin
      value: "{{gstin}}"
      type: query
    - name: action
      value: NRTN
      type: query
    - name: fromDate
      value: 01-01-2026
      type: query
    - name: toDate
      value: 31-01-2026
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
