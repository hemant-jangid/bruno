info:
  name: Ping
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/spark/system/ping"
  headers:
    - name: Octa-ApiKey
      value: "{{api_key}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: This API key can be used to test the connectivity with the Spark API server. It also verifies that the API key has been configured correctly.
